[Launcher]
; DXVK is the default. Original is an alternative.
; D3D9On12 is experimental: mission loading can hang the GPU on some systems.
Renderer=DXVK

GamePath=
GraphicsProfile=Keep
NativeResolution=1
[Connection]
; Auto, Meta, OpenXR, VDXR or SteamVR. RuntimeJson is optional for OpenXR.
Mode=Auto
RuntimeJson=

[VR]
StaticBufferBatching=1
HideLocalRopes=0
On12QueuePacing=1
GPUTransport=1
DXVKGPUTransport=1
GPUSharedD3D9=1
GPUCompletePairs=1
ReleaseUploadedGPUSources=1
MetaDirectGPUUpload=1
; Start the headset host automatically after the DLL is injected (1) or wait for F9 (0).
AutoStart=1
; 1 = first-person stereo view (alternating eyes, head tracking); 0 = flat panel.
StereoMode=1
; Native engine camera and visibility frustum (pinned EXE build only).
; 0 selects the guarded D3D9 shader fallback on the next game launch.
NativeCamera=1
; Anchor the native camera at the local player's head attachment.
FirstPerson=1
; Experimental tracked cutscenes; 0 watches the original shot on a cinema screen.
CinematicVR=0
; Standing eye height fallback only, if the skeleton is not yet available.
PlayerEyeHeightMm=1700
; Forward offset fallback without a valid first-person player anchor, millimetres.
CameraForwardMm=1500
; Extra projection coverage for compositor head rotation, percent (100-200).
RenderFovPercent=118
; Stereo near plane in millimetres; smaller values clip less of the player model.
NearPlaneMm=50
; Physical head translation for peeking, bounded in all directions in mm.
; 0 locks translation; 100-1500 enables direct tracked motion without smoothing.
HeadPositionMm=350
; Glacier world geometry is expected in centimetres like the Hitman titles;
; the VR delta is authored in metres.
WorldUnitsPerMetre=100
; Diagnostic only: capture frames without the headset host (0 in normal use).
CaptureWithoutHost=0
; Flat panel size in millimetres at PanelDistanceMm in front of the view (StereoMode=0).
PanelWidthMm=3600
PanelDistanceMm=2000

ForcePanel=0
[Audio]
; Select the connected headset output before the game initializes sound.
Enabled=1
Output=Auto
; Disable legacy EAX effects only (OpenAL may still be the active backend).
; Keep a verified backup and change only UseEAX in the game's user profile.
DisableEAX=1
FallbackToDefault=1

[HUD]
; Skip owned auxiliary inset camera rendering.
HideAuxiliaryPip=1
Immersive=1
; Project native HUD text/icons onto a common head-local plane for both eyes.
Stereo=1
DistanceMm=2000
ScalePercent=80

GameHints=1
[Hands]
; Move the player's own arms and attachment bones with Touch poses.
NativeArms=1
; Hide the player's own head only in the first-person GPU skin palette.
HideHead=1
; Carry held firearm meshes with the solved wrist and aim along its pointing ray.
WeaponAim=1
; Optional independent glove overlay (kept off with native arms).
Enabled=0

[Controls]
; ImmersiveLayout=1: A tap RELEASE reloads; hold A 350ms while moving sprints.
; B tap toggles crouch. Hold B to climb when a ledge is available.
; Release X to interact.
; Tap Y to change weapon. Hold Y to show the weapon wheel, map and team.
; Right stick selects weapons. Release Y to equip and close the panels.
; While holding Y, press Right Grip to cycle forward through recipients.
; A recalls, B moves to the aiming point, right trigger orders attack.
; Left trigger has no aiming action. Sniper scope uses right-controller near-face.
; Left grip supports a long gun. Outside the panels, hold right grip to prepare a grenade;
; release throws, Y changes grenade type, X cancels while preparing.
; Left stick click toggles walk/run; right stick click recenters immediately.
; Menu pauses. Native menus: A/trigger confirms, B/Y back, X Space/title action.
; Native expanded map remains available on keyboard M.
Enabled=1
FocusOnAction=1
MovementHeadRelative=1
MenuMouse=0
MenuBothSticks=1
MenuWASD=0
MenuXSpace=1
MenuMouseSensitivity=10
MenuThresholdPercent=55
MouseSensitivity=14
RightStickPitch=0
TurnMode=2
SmoothTurnDegreesPerSecond=90
SnapTurnDegrees=30
ImmersiveLayout=1
DeadzonePercent=35
TriggerPercent=55

[Diagnostics]
; Measure native game waits without changing timeout/result.
NativeWaitTimings=1
; Retain every native Present in a bounded ring; diagnostics worker writes JSONL.
FrameEvents=1
; Automatic retained logs, one new session per process. Native graphics stay in game.
PerformanceLogging=1
SessionMonitor=1
CrashLogging=1
; Sampled mod CPU regions and nonblocking D3D9 GPU queue spans.
CpuTimings=1
GpuTimings=1
; Bounded rolling performance history per run; previous runs stay intact.
PerformanceMaxMegabytes=16
PerformanceSegments=4

ObjectivePairTrace=1
NativeBufferFlushTimings=1
WeaponMaterialSequence=1
ReflectionMaterialProbe=1
PostfilterStageProbe=1
VisualDrawCapture=1
Enabled=0

[Weapons]
ReticleStyle=1
MountedReticle=1
MountedMouseAim=0
; Left-hand magazine, shell and bolt mechanics for supported weapons.
; 0 uses the original reload when you press A.
PhysicalReload=1
; Left grip supports a long gun outside the held Y panels.
SupportGrip=1
NativeReticle=0
LaserSight=1
[Debug]
Invulnerable=0
TestingModifiers=0


[Recording]
; Start optional recording hotkeys explicitly with Record-KaneLynch-VR.cmd.
Enabled=0
